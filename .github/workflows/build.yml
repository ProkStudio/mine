name: build
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}/java-tmp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Prepare isolated ASCII paths
        run: mkdir -p "$GRADLE_USER_HOME" "${{ runner.temp }}/java-tmp"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Standalone transport rules
        run: bash tests/run.sh
      - name: Clean build including JUnit and resource validation
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-build-cache --rerun-tasks --stacktrace clean build
      - name: Require actual VehicleStateTest execution
        run: python3 tests/verify_results.py
      - name: Test reports and worker diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test-reports-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
            build/verification/
            ${{ runner.temp }}/gradle-home/workers/worker-error-*.txt
          if-no-files-found: ignore
      - name: Mod artifacts
        uses: actions/upload-artifact@v7
        with:
          name: harvester-mod-1.2.0-${{ github.sha }}
          path: build/libs/

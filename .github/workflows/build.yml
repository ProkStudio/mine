name: build
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}/java-tmp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare isolated ASCII paths
        run: mkdir -p "$GRADLE_USER_HOME" "${{ runner.temp }}/java-tmp"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Standalone transport rules
        run: bash tests/run.sh
      - name: Clean build including client code, JUnit and resource validation
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --no-build-cache --rerun-tasks --stacktrace clean build 2>&1 | tee "$RUNNER_TEMP/mine-build.log"
      - name: Require every expected JUnit suite to execute
        run: python3 tests/verify_results.py
      - name: Test reports and worker diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test-reports-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
            build/verification/
            ${{ runner.temp }}/mine-build.log
            ${{ runner.temp }}/gradle-home/workers/worker-error-*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Mod artifacts
        uses: actions/upload-artifact@v7
        with:
          name: harvester-mod-${{ github.sha }}
          path: build/libs/
          if-no-files-found: error
          retention-days: 14

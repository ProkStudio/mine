name: Military Vehicles
on:
  push:
    paths:
      - 'military-vehicles/**'
      - '.github/workflows/military-vehicles.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    paths:
      - 'military-vehicles/**'
      - '.github/workflows/military-vehicles.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Standalone rules
        run: bash military-vehicles/tests/run-core.sh
      - name: Compile mod and client, run tests, generate assets
        run: bash ./gradlew -p military-vehicles --no-daemon --console=plain --no-build-cache --rerun-tasks clean build
      - name: Verify exact test coverage and installable JAR
        run: python3 military-vehicles/tools/verify_build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: military-vehicles-${{ github.sha }}
          path: |
            military-vehicles/build/libs/*.jar
            military-vehicles/build/test-results/test/*.xml
            military-vehicles/build/reports/tests/test/
            military-vehicles/build/verification.json
          if-no-files-found: error
          retention-days: 14

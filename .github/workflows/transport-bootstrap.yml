name: Transport release integration
on:
  push:
    branches: [feature/vehicle-art-pass-20260907]
    paths: ['tools/apply_transport_polish.py', 'tools/polish-input/**', '.github/workflows/transport-bootstrap.yml']
permissions:
  contents: read
concurrency:
  group: transport-release-integration
  cancel-in-progress: true
jobs:
  integrate:
    if: github.repository == 'ProkStudio/mine'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Prepare isolated build paths
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-home" "$RUNNER_TEMP/java-tmp"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
          echo "JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=$RUNNER_TEMP/java-tmp" >> "$GITHUB_ENV"
      - name: Apply source-checked integration and create local candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_transport_polish.py 2>&1 | tee "$RUNNER_TEMP/transport-build.log"
          git rm -r tools/polish-input tools/apply_transport_polish.py .github/workflows/transport-bootstrap.yml
          git diff --check
          git add src tools tests build.gradle gradle.properties README.md docs/TRANSPORT-RELEASE-STATE.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: transport 1.3 RC scale, mechanical assemblies, motion and audio'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Clean full build, all JUnit and both offline smoke suites
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run.sh 2>&1 | tee -a "$RUNNER_TEMP/transport-build.log"
          bash ./gradlew --no-daemon --no-build-cache --rerun-tasks --stacktrace clean build 2>&1 | tee -a "$RUNNER_TEMP/transport-build.log"
          GITHUB_SHA="$(git rev-parse HEAD)" python3 tests/verify_results.py 2>&1 | tee -a "$RUNNER_TEMP/transport-build.log"
          bash tests/run-visual-smoke.sh 2>&1 | tee -a "$RUNNER_TEMP/transport-build.log"
          (cd build/polish-meshes && sha256sum -c ../../tests/expected-polish-meshes.sha256) 2>&1 | tee -a "$RUNNER_TEMP/transport-build.log"
      - name: Persist only the validated source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" -f state=success -f context='transport/release-validation' -f description='Full client build, 59 JUnit methods, geometry/audio and both smoke suites passed' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Build products and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transport-integration-${{ github.sha }}
          path: |
            build/libs/
            build/test-results/
            build/verification/
            build/polish-meshes/
            ${{ runner.temp }}/transport-build.log
          if-no-files-found: warn
          retention-days: 30
      - name: Save failure diagnostics for continuation
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error,pathlib,re
          repo=os.environ['GITHUB_REPOSITORY'];branch=os.environ['GITHUB_REF_NAME']
          assert repo=='ProkStudio/mine' and branch=='feature/vehicle-art-pass-20260907'
          url='https://api.github.com/repos/'+repo+'/contents/docs/TRANSPORT-CI-LAST.log'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'transport-build.log'
          text=path.read_text(errors='replace') if path.exists() else 'Build did not reach logged step. Inspect Actions.'
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          text='FAILED integration checkpoint. Run: https://github.com/'+repo+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n'+'\n'.join(text.splitlines()[-180:])[-22000:]
          payload={'message':'docs: preserve transport integration failure diagnostics','branch':branch,'content':base64.b64encode(text.encode()).decode()}
          try:
              request=urllib.request.Request(url+'?ref='+urllib.parse.quote(branch,safe=''),headers=headers)
              payload['sha']=json.load(urllib.request.urlopen(request))['sha']
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
          request=urllib.request.Request(url,data=json.dumps(payload).encode(),headers=headers,method='PUT')
          urllib.request.urlopen(request).read()
          PY

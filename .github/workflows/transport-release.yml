name: Transport RC release
on:
  push:
    branches: [feature/vehicle-art-pass-20260907]
    paths: ['.github/workflows/transport-release.yml', 'tools/package_transport_release.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: transport-release-v1.3.0-rc.1
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'ProkStudio/mine' && github.ref == 'refs/heads/feature/vehicle-art-pass-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: v1.3.0-rc.1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Prepare isolated build paths
        run: |
          mkdir -p "$RUNNER_TEMP/transport-gradle" "$RUNNER_TEMP/transport-java"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/transport-gradle" >> "$GITHUB_ENV"
          echo "JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=$RUNNER_TEMP/transport-java" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/transport-java" >> "$GITHUB_ENV"
      - name: Clean complete build and mandatory verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash tests/run.sh 2>&1 | tee "$RUNNER_TEMP/transport-release.log"
          bash ./gradlew --no-daemon --no-build-cache --rerun-tasks --no-parallel --max-workers=2 --stacktrace clean build 2>&1 | tee -a "$RUNNER_TEMP/transport-release.log"
          python3 tests/verify_results.py 2>&1 | tee -a "$RUNNER_TEMP/transport-release.log"
          bash tests/run-visual-smoke.sh 2>&1 | tee -a "$RUNNER_TEMP/transport-release.log"
          (cd build/polish-meshes && sha256sum -c ../../tests/expected-polish-meshes.sha256) 2>&1 | tee -a "$RUNNER_TEMP/transport-release.log"
          python3 tools/package_transport_release.py 2>&1 | tee -a "$RUNNER_TEMP/transport-release.log"
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transport-rc-evidence-${{ github.sha }}
          path: |
            build/release/
            build/test-results/
            build/verification/
            ${{ runner.temp }}/transport-release.log
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified prerelease without replacing an existing tag
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Tag already exists; refusing to move it.'; exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" >/dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" build/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --verify-tag --draft --prerelease --latest=false --title 'Harvester Transport Pack 1.3.0-rc.1' --notes-file build/release/RELEASE-NOTES.md
          mkdir -p "$RUNNER_TEMP/release-readback"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-readback"
          cmp build/release/SHA256SUMS "$RUNNER_TEMP/release-readback/SHA256SUMS"
          (cd "$RUNNER_TEMP/release-readback" && sha256sum -c SHA256SUMS)
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
          echo 'RELEASE_PUBLISHED=true' >> "$GITHUB_ENV"
      - name: Capture prior PR failure for diagnosis
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view 34141419192 --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/transport-pr-diagnostic.log" 2>&1 || true
      - name: Persist continuation checkpoint
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOB_OUTCOME: ${{ job.status }}
        run: python3 tools/transport_release_checkpoint.py

name: Vehicle art and full build

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vehicle-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install offline-renderer dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.3 Pillow==11.3.0
      - name: Validate real source geometry, resources and pose math
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          printf '%s\n' "$GITHUB_SHA" > build/visual-smoke-sha.txt
          bash tests/run-visual-smoke.sh --previews 2>&1 | tee build/visual-smoke.log
          printf '%s\n' 'Offline source-mesh previews. Not Minecraft screenshots; no client, shader or performance validation.' > build/previews/README.txt
      - name: Attach previews and the actual smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vehicle-art-${{ github.sha }}
          path: |
            build/visual-smoke.log
            build/visual-smoke-sha.txt
            build/previews/
            build/preview-meshes/
          if-no-files-found: warn
          retention-days: 14

  full-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}/java-tmp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare isolated build paths
        run: mkdir -p "$GRADLE_USER_HOME" "${{ runner.temp }}/java-tmp"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Standalone transport rules
        run: bash tests/run.sh
      - name: Compile the mod and client, run tests and validate resources
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --no-build-cache --rerun-tasks --stacktrace clean build 2>&1 | tee "$RUNNER_TEMP/mine-full-build.log"
      - name: Require all expected JUnit methods without failures or skips
        run: python3 tests/verify_results.py
      - name: Attach real build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-build-reports-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
            build/verification/
            ${{ runner.temp }}/mine-full-build.log
            ${{ runner.temp }}/gradle-home/workers/worker-error-*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Attach successfully built mod
        uses: actions/upload-artifact@v7
        with:
          name: full-build-mod-${{ github.sha }}
          path: build/libs/
          if-no-files-found: error
          retention-days: 14
